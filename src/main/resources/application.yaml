spring:
  application:
    name: tax-tracker
  datasource:
    url: jdbc:postgresql://localhost:3305/tax_tracker
    username: tax_tracker
    password: tax_tracker
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

binance:
  price:
    base-url: https://api.binance.com
    requests-per-minute: 300  # klines = 2 weight; Binance allows 1200 weight/min → 600 rpm safe ceiling

import:
  binance:
    file: src/main/resources/import-files/Binance-Transaction-History-202611131053(UTC+1)-part1-of1.csv
    withdraw-file: src/main/resources/import-files/Binance-Withdraw-History-202611141647(UTC+1)-part1-of1.csv

