databaseChangeLog:
  - changeSet:
      id: 007-add-closed-at-to-tax-lot
      author: tax-tracker
      comment: "Add closedAt column to track when tax lots become fully disposed"
      changes:
        - addColumn:
            tableName: tax_lot
            columns:
              - column:
                  name: closed_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: "Timestamp when lot became fully disposed (remainingAmount = 0)"
      rollback:
        - dropColumn:
            tableName: tax_lot
            columnName: closed_at

